<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FIP Calculettes — Connexion</title>
<link rel="icon" href="commun/img/picto-fip.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun/style.css">
<script src="commun/utilisateurs.js"></script>
<script src="commun/auth.js"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:16px;background:#fff}
  .carte{width:100%;max-width:385px;padding:26px 24px 24px;border:1px solid #e3e5e9;border-radius:10px;box-shadow:0 2px 10px rgba(23,26,30,.06)}
  .logo{display:block;width:210px;max-width:75%;margin:0 auto 18px}
  .titre{text-align:center;font-size:18px;font-weight:800;margin:0;color:var(--ink)}
  .titre em{font-style:normal;color:var(--fip-rouge)}
  .sous{text-align:center;margin:6px 0 4px;font-size:13px;color:var(--muted)}
  button[type=submit]{width:100%;margin-top:22px;padding:12px;background:var(--ink);border-color:var(--ink);font-size:15px}
  button[type=submit]:hover{background:#000}
  .chk{font-size:13px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<form class="carte" id="f" autocomplete="on">
  <img class="logo" src="commun/img/logo-fip.png" alt="FIP — France Ingénierie Process">
  <p class="titre">FIP <em>Calculettes</em></p>
  <p class="sous">Outil interne du bureau d'études — accès réservé.</p>
  <label for="u">Identifiant</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Mot de passe</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <label class="chk"><input type="checkbox" id="m"> Rester connecté sur cet appareil (30 jours)</label>
  <button type="submit">Se connecter</button>
  <div id="e" class="msg err" hidden></div>
</form>
<script>
  // URL de retour : uniquement un chemin du même site (pas de redirection externe)
  function cible(){
    const r=new URLSearchParams(location.search).get('retour');
    try{ if(r){const url=new URL(r,location.href); if(url.origin===location.origin) return url.href;} }catch(e){}
    return 'accueil.html';
  }
  if(calcSession()) location.replace(cible());
  document.getElementById('f').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const e=document.getElementById('e'); e.hidden=true;
    if(typeof CALC_UTILISATEURS==='undefined'){ e.textContent="Erreur dans le fichier commun/utilisateurs.js (ligne mal collée ?) : aucun compte n'a pu être lu."; e.hidden=false; return; }
    let ok=false;
    try{ ok=await calcConnexion(u.value,p.value,m.checked); }
    catch(err){ e.textContent="Connexion impossible : ouvrir le site en https (GitHub Pages)."; e.hidden=false; return; }
    if(ok) location.replace(cible());
    else { e.textContent='Identifiant ou mot de passe incorrect.'; e.hidden=false; p.value=''; p.focus(); }
  });
</script>
</body>
</html>
